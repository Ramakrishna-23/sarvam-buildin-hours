[project]
name = "basha-bridge"
version = "0.1.0"
description = "Silent AI voice mediator for rider-driver calls (Sarvam build-in-hours)"
requires-python = ">=3.11"
dependencies = [
    "sarvamai>=0.1",
    "livekit>=1.0",
    "livekit-api>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
basha-bridge = "basha_bridge.cli:main"
basha-livekit-agent = "basha_bridge.livekit_relay_agent:main"
basha-fixture-call = "basha_bridge.livekit_fixture_call:main"
basha-token-server = "basha_bridge.token_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basha_bridge"]
