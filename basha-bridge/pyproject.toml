[project]
name = "basha-bridge"
version = "0.1.0"
description = "Silent AI voice mediator for rider-driver calls (Sarvam build-in-hours)"
requires-python = ">=3.11"
dependencies = [
    "sarvamai>=0.1",
    "livekit>=1.0",
    "livekit-api>=1.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.14.3",
]

[project.scripts]
basha-bridge = "basha_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basha_bridge"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
